<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - AlimentaBrasil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="imagens/foto-logo.jpg" alt="Logo AlimentaBrasil" width="60" class="logo-img">
            <div>
                <h1>AlimentaBrasil</h1>
                <p>CitizenTech contra a fome e o desperdício</p>
            </div>
        </div>
        <button class="hamburger-btn" aria-label="Abrir Menu">☰</button>
        <nav class="nav-menu">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="doacoes.html">Doações Disponíveis</a>
            <a href="quero-doar.html">Quero Doar</a>
            <a href="integrantes.html">Equipe</a>
            <a href="faq.html">FAQ</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <h2>Fale Conosco</h2>
        <p>Dúvidas institucionais ou parcerias? Envie-nos uma mensagem.</p>
        
        <section class="caixa">
            <!-- Validação JavaScript atrelada ao ID form-contato -->
            <form id="form-contato" action="#">
                <div class="campo">
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail Institucional:</label><br>
                    <input type="text" id="email" name="email" placeholder="exemplo@ong.com">
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva a sua dúvida ou proposta..."></textarea>
                </div>

                <button type="submit" class="botao">Enviar Mensagem</button>
                <div id="feedback-sucesso"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>AlimentaBrasil - Global Solution CitizenTech 2026</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
